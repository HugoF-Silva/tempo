name: Terraform CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # ← Build your Lambda ZIPs so Terraform can see them ↓
      - name: Set up Node.js (for npm install, if needed)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install & bundle Lambda functions
        run: |
          # connect
          pushd ../lambda/connect
          npm install --production
          zip -r ../../terraform/connect.zip .
          popd

          # disconnect
          pushd ../lambda/disconnect
          npm install --production
          zip -r ../../terraform/disconnect.zip .
          popd

          # broadcast
          pushd ../lambda/broadcast
          npm install --production
          zip -r ../../terraform/broadcast.zip .
          popd

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.4.0

      - name: Terraform fmt (check)
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -input=false -out=tfplan

      - name: Comment PR with plan
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform plan result
          path: tfplan
          recreate: true

      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan
